<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discipliner has moved</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      var TARGET = 'https://gym-discipliner.vercel.app';
      // Strip the GitHub Pages project prefix so "/gymDiscipliner/admin" -> "/admin".
      var path = window.location.pathname.replace(/^\/gymDiscipliner\/?/, '/');
      if (!path.startsWith('/')) path = '/' + path;
      window.location.replace(TARGET + path + window.location.search + window.location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="2;url=https://gym-discipliner.vercel.app/" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 4rem 1.5rem; max-width: 32rem; margin: 0 auto; color: #334155; line-height: 1.6; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; color: #0f172a; }
    a { color: #2563eb; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #cbd5e1; }
      h1 { color: #f1f5f9; }
      a { color: #60a5fa; }
    }
  </style>
</head>
<body>
  <h1>Discipliner has moved</h1>
  <p>This site is now hosted at <a href="https://gym-discipliner.vercel.app/">gym-discipliner.vercel.app</a>. Redirecting&hellip;</p>
  <p><a href="https://gym-discipliner.vercel.app/">Click here</a> if you are not redirected automatically.</p>
</body>
</html>
